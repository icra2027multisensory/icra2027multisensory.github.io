<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">The art of sensing and manipulation</title>
  <desc id="desc">A blue robot gripper holds an amber object among flowing lines, soft color fields, and small motifs for vision, sound, and touch.</desc>
  <defs>
    <linearGradient id="wash" x1="570" y1="160" x2="1190" y2="160" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f4f8f7" stop-opacity="0"/>
      <stop offset=".5" stop-color="#e8f2f0" stop-opacity=".7"/>
      <stop offset="1" stop-color="#edf4f7" stop-opacity=".25"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="530" y1="270" x2="1180" y2="210" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8ebcb9" stop-opacity="0"/>
      <stop offset=".55" stop-color="#8ebcb9" stop-opacity=".18"/>
      <stop offset="1" stop-color="#acc9dc" stop-opacity=".08"/>
    </linearGradient>
    <linearGradient id="metal" x1="-30" y1="-80" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f6fafb"/>
      <stop offset=".55" stop-color="#dce9ee"/>
      <stop offset="1" stop-color="#b9cedb"/>
    </linearGradient>
    <linearGradient id="finger" x1="-48" y1="38" x2="40" y2="98" gradientUnits="userSpaceOnUse">
      <stop stop-color="#e8f0f3"/>
      <stop offset="1" stop-color="#bfd2dd"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop stop-color="#f1dcb6" stop-opacity=".5"/>
      <stop offset="1" stop-color="#f1dcb6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Open color fields and flowing ribbons leave the title area clear. -->
  <g id="color-fields">
    <path d="M595 176C667 130 699 164 762 126C839 79 837 22 949 20C1074 17 1122 67 1200 42V272C1117 261 1070 312 966 286C885 266 858 303 780 273C718 249 656 271 595 240Z" fill="url(#wash)"/>
    <circle cx="1010" cy="151" r="119" fill="#f6ead6" opacity=".48"/>
    <circle cx="1050" cy="130" r="99" fill="#e5efef" opacity=".8"/>
    <path d="M466 288C645 211 696 304 832 224C940 161 989 184 1076 222C1128 246 1163 239 1200 214V251C1126 288 1080 260 1032 239C930 195 883 243 813 267C669 316 601 252 466 303Z" fill="url(#ribbon)"/>
    <path d="M658 85C775 19 808 103 909 64C1005 27 1084 38 1172 85" stroke="#c4d7df" stroke-width="1" opacity=".35"/>
    <path d="M677 93C775 38 819 115 914 77C1018 36 1094 55 1179 96" stroke="#c4d7df" stroke-width="1" opacity=".35"/>
  </g>

  <!-- Loose sensory paths, like lines in a scientific sketchbook. -->
  <g id="sensory-paths" stroke-linecap="round">
    <path d="M543 265C665 212 720 287 832 222S1001 189 1090 229S1172 228 1200 201" stroke="#7eaaa9" stroke-width="1.1" opacity=".45"/>
    <path d="M592 282C698 243 748 298 852 244S1009 211 1093 250S1171 246 1200 239" stroke="#9db9c7" stroke-width=".8" opacity=".5"/>
    <path d="M689 240C751 237 756 184 823 189C878 193 887 253 967 239" stroke="#5f929b" stroke-width="1.1" opacity=".4"/>
    <path d="M741 72C848 45 874 139 945 121C1024 100 1080 140 1131 105" stroke="#c7a363" stroke-width="1.2" stroke-dasharray="2 7" opacity=".6"/>
    <ellipse cx="979" cy="169" rx="177" ry="103" transform="rotate(-18 979 169)" stroke="#7fa6af" stroke-width="1" opacity=".45"/>
    <path d="M857 69C927 22 1050 29 1103 95" stroke="#9cbabf" stroke-width="1" opacity=".35"/>
    <path d="M855 261C906 288 1020 288 1085 247" stroke="#c1a773" stroke-width="1" opacity=".5"/>
    <path d="M829 111L942 211M839 98L963 192" stroke="#7ea6af" stroke-width=".9" stroke-dasharray="3 6" opacity=".35"/>
    <path d="M1117 185C1080 186 1058 233 1000 224" stroke="#6e9d9f" stroke-width="1" stroke-dasharray="2 6" opacity=".5"/>
  </g>

  <!-- Vision: a small eye drawn directly as editable paths. -->
  <g id="vision" transform="translate(804 100)" stroke="#668b9b" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
    <circle r="29" fill="#f5faf9" stroke="#c5d9db" stroke-width="1"/>
    <path d="M-19 0C-8-14 8-14 19 0C8 14-8 14-19 0Z"/>
    <circle r="6" fill="#d3e5e7"/>
    <circle r="2.2" fill="#668b9b" stroke="none"/>
  </g>

  <!-- Sound: an organic waveform, not a labeled diagram. -->
  <g id="sound" transform="translate(1137 182)" stroke="#7c9ea4" stroke-width="1.3" stroke-linecap="round">
    <circle r="27" fill="#f5faf9" stroke="#c5d9db" stroke-width="1"/>
    <path d="M-17 0H-13C-10 0-10-8-7-8S-4 11-1 11S2-14 5-14S8 7 11 7S13 0 17 0"/>
  </g>

  <!-- Touch: contour lines recall a fingertip and a contact patch. -->
  <g id="touch" transform="translate(852 252) rotate(-15)" stroke="#81a6a7" stroke-width="1.1" stroke-linecap="round">
    <path d="M-24 3C-27-25 23-28 25-1C26 15 9 26-6 21" opacity=".45"/>
    <path d="M-18 6C-27-15 8-30 18-10C28 10 1 28-11 14" opacity=".65"/>
    <path d="M-12 7C-25-6 1-24 11-10C23 7 0 22-7 11"/>
    <path d="M-6 4C-15-5 0-15 6-7C13 3 0 15-3 9"/>
    <path d="M0 0L0 5"/>
  </g>

  <!-- The manipulation scene, with separate arm, joint, fingers, and object. -->
  <g id="robot-gripper" transform="translate(1003 119) rotate(24)" stroke="#57778a" stroke-width="1.5" stroke-linejoin="round">
    <ellipse cx="0" cy="119" rx="60" ry="32" fill="url(#halo)" stroke="none"/>

    <g id="arm">
      <path d="M-23-82Q-25-91-15-94H15Q25-91 23-82L20-33H-20Z" fill="url(#metal)"/>
      <path d="M-13-84V-43" stroke="#fff" stroke-width="3" opacity=".9"/>
      <path d="M14-81V-42" stroke="#9fb8c6" stroke-width="1"/>
      <path d="M-23-82H23M-21-42H21" stroke="#9fb8c6" stroke-width="1"/>
      <rect x="-28" y="-37" width="56" height="26" rx="9" fill="#b7ced9"/>
      <path d="M-22-28H22M-22-22H22" stroke="#e9f2f5" stroke-width="2"/>
      <path d="M-18-11H18V5H-18Z" fill="#809eaf"/>
      <path d="M23-73C44-72 43-20 30-9" stroke="#91adb9" stroke-width="3"/>
      <path d="M24-73C43-71 40-22 29-11" stroke="#e9f0f2" stroke-width="1"/>
    </g>

    <g id="palm">
      <path d="M-35 0H35L43 10V34L32 43H-32L-43 34V10Z" fill="url(#metal)"/>
      <rect x="-28" y="9" width="56" height="22" rx="5" fill="#eef4f6" stroke="#97b3c2"/>
      <path d="M-13 16H13M-13 22H7" stroke="#9fb9c5" stroke-width="1"/>
      <circle cx="-34" cy="17" r="2.5" fill="#7594a5" stroke="none"/>
      <circle cx="34" cy="17" r="2.5" fill="#7594a5" stroke="none"/>
      <path d="M-30 37H30" stroke="#fbfdfd" stroke-width="2"/>
    </g>

    <g id="fingers">
      <path d="M-40 34H-25L-28 65L-17 89L-26 101L-38 91L-47 67Z" fill="url(#finger)"/>
      <path d="M40 34H25L28 65L17 89L26 101L38 91L47 67Z" fill="url(#finger)"/>
      <path d="M-34 48L-37 65L-27 87M34 48L37 65L27 87" stroke="#f5f9fb" stroke-width="2"/>
      <circle cx="-33" cy="43" r="5" fill="#91acba"/>
      <circle cx="33" cy="43" r="5" fill="#91acba"/>
      <circle cx="-36" cy="67" r="3" fill="#c5d7df"/>
      <circle cx="36" cy="67" r="3" fill="#c5d7df"/>
      <path d="M-24 84L-17 89L-22 101L-30 98Z" fill="#5a7888"/>
      <path d="M24 84L17 89L22 101L30 98Z" fill="#5a7888"/>
    </g>

    <g id="held-object" stroke="#bc9656" stroke-width="1.2">
      <path d="M0 83L24 96L0 111L-24 96Z" fill="#f0d9ac"/>
      <path d="M-24 96L0 111V139L-24 124Z" fill="#dfb778"/>
      <path d="M0 111L24 96V124L0 139Z" fill="#cfa366"/>
      <path d="M0 86L20 97M-20 100V122" stroke="#fae8c9" stroke-width="1.5"/>
      <path d="M-35 110C-42 119-35 127-29 128M35 110C42 119 35 127 29 128" stroke="#c5a96e" stroke-width="1" opacity=".6"/>
      <path d="M-42 105C-54 121-43 134-34 136M42 105C54 121 43 134 34 136" stroke="#c5a96e" stroke-width="1" opacity=".35"/>
    </g>
  </g>

  <!-- Sparse marks keep the illustration light at banner size. -->
  <g id="sketch-marks">
    <circle cx="877" cy="56" r="4" fill="#d7b77b"/>
    <circle cx="1075" cy="75" r="3" fill="#86acab"/>
    <circle cx="902" cy="280" r="2.5" fill="#d7b77b"/>
    <circle cx="744" cy="211" r="3" fill="#a3c3c8"/>
    <circle cx="1095" cy="252" r="4" fill="#adc9cb"/>
    <circle cx="1121" cy="118" r="2" fill="#d2b784"/>
    <path d="M758 146H766M762 142V150M1148 83H1156M1152 79V87M892 170H898M895 167V173" stroke="#a5bec6" stroke-width="1" stroke-linecap="round"/>
    <path d="M910 31L916 34L911 38M1098 262L1093 266L1099 268" stroke="#9bb6bd" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
